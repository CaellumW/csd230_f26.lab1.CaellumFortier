<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Shopping Cart</title>
    https://cdn.tailwindcss.comscript>
</head>
<body>
<h1>Your Shopping Cart</h1>

<div style="float:right">
    <!-- Display logged in user -->
    Logged in as: <span sec:authentication="name">User</span>

    <!-- Logout Form (Must be POST for security) -->
    <form th:action="@{/logout}" method="post" style="display:inline;">
        <input type="submit" value="Sign Out"/>
    </form>
</div>

<div th:if="${cart.products.empty}">
    <p>Your cart is empty.</p>
</div>


<table border="1" th:unless="${cart.products.empty}">
    <thead>
    <tr>
        <th>Item Name / Description</th>
        <th>Type</th>
        <th>Price</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${cart.products}">
        <td>
            <span th:if="${product instanceof T(csd230.lab1.entities.PublicationEntity)}"
                  th:text="${product.title}"></span>


            <span th:if="${product instanceof T(csd230.lab1.entities.TicketEntity)}"
                  th:text="${product.description}"></span>
        </td>


        <td th:text="${product.productType}"></td>


        <td th:text="${product.price}"></td>
        <td>
            <a th:href="@{/cart/remove/{id}(id=${product.id})}">Remove</a>
        </td>
    </tr>
    </tbody>
</table>


<br/>
<p>
    <a th:href="@{/books}">Continue Shopping</a>
    <a th:href="@{/checkout/cartId}">Checkout</a>
</p>

</body>
</html>
